    <style>
        /* ② 画面全体（body）にドット絵風フォントを適用するCSS */
        body {
        font-family: "DotGothic16", sans-serif;
        background-color: #111; /* 背景を黒にするとよりゲームっぽくなります */
        color: #fff;            /* 文字を白に */
        padding: 20px;
        text-align: center;
        }

        /* ボタンもドット絵風に合わせる場合のサンプルCSS */
        input[type="button"] {
        font-family: "DotGothic16", sans-serif;
        font-size: 18px;
        padding: 10px 20px;
        margin: 10px;
        background-color: #333;
        color: #fff;
        border: 3px solid #fff; /* 白い枠線でファミコン風に */
        cursor: pointer;
        }
        
        input[type="button"]:hover {
        background-color: #555;
        }
        
        input[type="button"]:disabled {
        background-color: #222;
        color: #666;
        border-color: #555;
        cursor: not-allowed;
        }
            /* 📦 コマンド表示用ボックスのCSS */
    .message-box {
      max-width: 500px;
      margin: 30px auto;      /* ボタンの下に適度な余白を空けて中央配置 */
      padding: 20px;
      background-color: #000; /* ボックスの中は真っ黒 */
      border: 4px double #fff;/* 白い2本線の枠（ファミコン風） */
      border-radius: 5px;     /* 角をほんの少し丸く */
      min-height: 200px;       /* 文字がなくても潰れないように高さを確保 */
      font-size: 20px;
      line-height: 1.5;
      text-align: left;       /* 左詰めでメッセージを表示 */
    }
    </style>

</head>

    <h1>じゃんけんバトル</h1>

    <!-- 📦 ボタンの下に配置したメッセージボックス -->
    <div id="msgBox" class="message-box">

    </div>

        <input type="button" id="btnC" onclick="myChoice(1)" value="チョキ">
        <input type="button" id="btnP" onclick="myChoice(2)" value="パー">
    </form>
