<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ドット絵風じゃんけんゲーム</title>

    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">

    <!-- Google Fonts から「DotGothic16」を読み込むコード -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <!-- タイトル画面（ここをクリックさせることで音を解放） -->
    <div id="titleScreen">
        <h1 style="font-size: 32px; margin-bottom: 40px;">じゃんけんクエスト</h1>
        <input type="button" id="btnStart" onclick="startGame()" value="START">
    </div>

    <!-- ゲーム画面一式は、最初は見えないように style="display: none;" をつけて囲みます -->
    <div id="gameScreen" style="display: none;">
        <h1>じゃんけんクエスト</h1>

        <!-- メッセージボックス *別途、jsにてメッセージ内容を記述する -->
        <div id="msgBox" class="message-box"></div>

        <form name="form1">
            <!-- じゃんけん用のボタン -->
            <input type="button" id="btnG" onclick="myChoice(0)" value="グー">
            <input type="button" id="btnC" onclick="myChoice(1)" value="チョキ">
            <input type="button" id="btnP" onclick="myChoice(2)" value="パー">
        
            <!-- 【追加】もう一度ボタン（初期状態は非表示） -->
            <input type="button" id="btnReset" onclick="resetGame()" value="もう一度" style="display: none;">
        </form>
    </div>
</body>
<script src="js/script.js"></script>
</html>
